name: Release Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS installers
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS desktop artifacts
        run: |
          npm run build
          npm run build:icon
          npx electron-builder --mac zip dmg --arm64 --publish never

      - name: Launch the packaged Apple Silicon app
        run: node scripts/check-packaged-startup.mjs release/mac-arm64/Charlie.app/Contents/MacOS/Charlie

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: charlie-macos-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows ${{ matrix.arch }} installers
    strategy:
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            output: win-unpacked
          - arch: arm64
            runner: windows-11-arm
            output: win-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop artifacts
        run: |
          npm run build
          npm run build:icon
          npx electron-builder --win nsis portable --${{ matrix.arch }} --publish never

      - name: Launch the packaged Windows app
        run: node scripts/check-packaged-startup.mjs release/${{ matrix.output }}/Charlie.exe

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: charlie-windows-installers-${{ matrix.arch }}
          path: release/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    permissions:
      contents: write
    steps:
      - name: Check out release notes from the tag
        uses: actions/checkout@v6

      - name: Download installer artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) | sort)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          notes=(--generate-notes)
          if [[ -f "docs/releases/$TAG_NAME.md" ]]; then
            notes=(--notes-file "docs/releases/$TAG_NAME.md")
          fi

          gh release create "$TAG_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Charlie ${TAG_NAME#v}" \
            "${notes[@]}" \
            --latest
