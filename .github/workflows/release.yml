name: Release Installers

on:
  push:
    tags:
      - 'v*'

jobs:
  build-macos:
    name: Build macOS installers
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS desktop artifacts
        run: |
          npm run build
          npm run build:icon
          npx electron-builder --mac zip dmg --publish never

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: charlie-macos-installers
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop artifacts
        run: |
          npm run build
          npm run build:icon
          npx electron-builder --win nsis portable --x64 --arm64 --publish never

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: charlie-windows-installers
          path: release/*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-windows
    permissions:
      contents: write
    steps:
      - name: Download installer artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) | sort)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          gh release create "$TAG_NAME" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Charlie ${TAG_NAME#v}" \
            --generate-notes \
            --latest
